name: Test 2
on: 
  pull_request:
    branches:
      - main
      - srabani_dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the source branch raising the PR
      - name: Checkout PR Branch
        uses: actions/checkout@v4

      # Step 2: Switch context explicitly to the dev branch
      - name: Switch to Dev Branch Context
        run: |
          git fetch origin srabani_dev
          git checkout srabani_dev
          echo "Currently working within the context of branch: $(git branch --show-current)"
      
      # Step 3: Fixed conditional logic mapping secrets securely to env first
      - name: Select Project & SA 
        id: detect 
        env:
          DEV_KEY: ${{ secrets.DEV_CONNECT_DBT }}
          # PROD_KEY: ${{ secrets.PROD_CONNECT_DBT }}
        run: |
          if [ "${{ github.base_ref }}" = "srabani_dev" ]; then
            echo "SA_KEY<<EOF" >> $GITHUB_OUTPUT
            echo "$DEV_KEY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "prod connect"
          fi

      # Step 3: Authenticate to GCP using the traditional JSON Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          #credentials_json: ${{ steps.detect.outputs.SA_KEY}}
          credentials_json: ${{ github.base_ref == 'srabani_dev' && secrets.DEV_CONNECT_DBT }}

      # Step 4: Verify the authentication succeeded
      - name: Verify GCP Connection
        run: |
          gcloud auth list
          gcloud config get-value project
          echo "authentication successful"
